<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset AttendEase password</title>
</head>
<body>
  <main>
    <h1>Reset your password</h1>
    <form method="post" action="{% url 'password-reset-confirm' %}">
      {% csrf_token %}
      <input type="hidden" name="uid" value="{{ uid }}">
      <input type="hidden" name="token" value="{{ token }}">
      <label for="new-password">New password</label>
      <input id="new-password" type="password" name="new_password" required autocomplete="new-password">
      <button type="submit">Reset password</button>
    </form>
  </main>
</body>
</html>
