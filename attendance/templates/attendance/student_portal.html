{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AttendEase Student Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="{% static 'attendance/student_portal.js' %}" defer></script>
</head>
<body class="bg-light">
  <main class="container py-4 py-md-5" id="portal"
        data-login-url="{% url 'login' %}"
        data-refresh-url="{% url 'refresh' %}"
        data-logout-url="{% url 'logout' %}"
        data-dashboard-url="{% url 'student-dashboard' %}"
        data-history-url="{% url 'student-history' %}">
    <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
      <div>
        <p class="text-primary fw-semibold mb-1">AttendEase</p>
        <h1 class="h2 mb-0">Student dashboard</h1>
      </div>
      <button id="logout" class="btn btn-outline-secondary d-none" type="button">Sign out</button>
    </header>

    <div id="message" class="alert d-none" role="status" aria-live="polite"></div>

    <section id="login-panel" class="card shadow-sm mx-auto" style="max-width: 28rem" aria-labelledby="login-heading">
      <div class="card-body p-4">
        <h2 id="login-heading" class="h4">Sign in to view attendance</h2>
        <form id="login-form" class="mt-3">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" class="form-control" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" class="form-control" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
      </div>
    </section>

    <div id="dashboard-panel" class="d-none">
      <section aria-labelledby="courses-heading" class="mb-4">
        <h2 id="courses-heading" class="h4 mb-3">Attendance by course</h2>
        <div id="course-cards" class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3"></div>
      </section>

      <section class="card shadow-sm" aria-labelledby="history-heading">
        <div class="card-body">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
            <h2 id="history-heading" class="h4 mb-0">Session history</h2>
            <form id="date-filter" class="row row-cols-1 row-cols-sm-auto g-2 align-items-end">
              <div class="col">
                <label for="from-date" class="form-label">From</label>
                <input id="from-date" name="from" type="date" class="form-control">
              </div>
              <div class="col">
                <label for="to-date" class="form-label">To</label>
                <input id="to-date" name="to" type="date" class="form-control">
              </div>
              <div class="col"><button class="btn btn-primary w-100" type="submit">Filter</button></div>
            </form>
          </div>
          <div class="table-responsive">
            <table class="table table-striped align-middle mb-0">
              <caption class="visually-hidden">Your closed attendance sessions</caption>
              <thead><tr><th scope="col">Date</th><th scope="col">Course</th><th scope="col">Section</th><th scope="col">Status</th></tr></thead>
              <tbody id="history-rows"></tbody>
            </table>
          </div>
          <p id="empty-history" class="text-muted mt-3 d-none">No closed sessions match this range.</p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
